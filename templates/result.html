<!DOCTYPE html>
<html>

<head>

<title>Quiz Result</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.result-container{
background:white;
padding:40px;
border-radius:15px;
width:700px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
animation:fadeIn 1s ease;
}

h1{
text-align:center;
color:#333;
}

.score{
font-size:40px;
font-weight:bold;
text-align:center;
color:#28a745;
margin-bottom:30px;
animation:pop 0.8s ease;
}

.question-box{
background:#f4f6ff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.correct{
color:#28a745;
font-weight:bold;
}

.wrong{
color:#dc3545;
font-weight:bold;
}

.answer{
margin-top:5px;
}

.restart-btn{
display:block;
margin:25px auto 0;
padding:12px 25px;
background:#007bff;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
text-decoration:none;
text-align:center;
width:150px;
}

.restart-btn:hover{
background:#0056b3;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

@keyframes pop{
0%{transform:scale(0.6);}
100%{transform:scale(1);}
}

</style>

</head>

<body>

<div class="result-container">

<h1>🎉 Quiz Result</h1>

<div class="score">
Score: {{ score }} / {{ total }}
</div>

{% for r in results %}

<div class="question-box">

<p><strong>Question:</strong> {{ r.question }}</p>

<p class="answer">
<strong>Your Answer:</strong> {{ r.user_answer }}
</p>

<p class="answer">
<strong>Correct Answer:</strong> {{ r.correct_answer }}
</p>

{% if r.status == "correct" %}
<p class="correct">✅ Correct</p>
{% else %}
<p class="wrong">❌ Wrong</p>
{% endif %}

</div>

{% endfor %}

<a href="/" class="restart-btn">Redo Quiz</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

let score = {{ score }};
let total = {{ total }};

if(score === total){

confetti({
particleCount:250,
spread:120,
origin:{y:0.6}
});

}

</script>

</body>

</html>
